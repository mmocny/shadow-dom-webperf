<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo 3: Shadow DOM Subresources &amp; window.onload</title>
  <style>
    :root {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #0f172a;
      background: #f8fafc;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 40px 20px; }
    .shell {
      max-width: 720px;
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 28px;
      display: grid;
      gap: 20px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 14px;
    }
    h1 { margin: 0; font-size: 18px; }
    button {
      background: #0f172a;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 14px;
    }
    .output {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 16px 18px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 14px;
      line-height: 1.8;
    }
    .key { color: #64748b; }
    .val { font-weight: 700; color: #0f172a; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="header">
      <h1>Demo 3: Shadow DOM &amp; window.onload</h1>
      <button type="button" onclick="location.reload()">Reload</button>
    </div>

    <div class="controls">
      <open-load-card id="open-host"></open-load-card>
      <closed-load-card id="closed-host"></closed-load-card>
    </div>

    <div class="output">
      <div><span class="key">document.readyState:</span> <span class="val" id="v-state">—</span></div>
      <div><span class="key">DOMContentLoaded:</span> <span class="val" id="v-dcl">—</span></div>
      <div><span class="key">window.onload:</span> <span class="val" id="v-load">waiting for shadow &lt;img&gt;s…</span></div>
    </div>
  </div>

  <script>
    const vState = document.getElementById('v-state');
    const vDcl = document.getElementById('v-dcl');
    const vLoad = document.getElementById('v-load');

    vState.textContent = JSON.stringify(document.readyState);

    function makeProgressSvg(label, pct, color, done) {
      const bg = done ? color : '#334155';
      const barW = Math.max(4, Math.round((pct / 100) * 260));
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="280" height="54">
        <rect width="100%" height="100%" rx="6" fill="#0f172a"/>
        <text x="12" y="22" fill="#f8fafc" font-family="monospace" font-size="11.5" font-weight="bold">${label}</text>
        <rect x="10" y="32" width="260" height="10" rx="5" fill="#334155"/>
        <rect x="10" y="32" width="${barW}" height="10" rx="5" fill="${bg}"/>
      </svg>`;
      return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
    }

    function buildSlowLoadWidget(sr, modeLabel, accentColor, durationMs) {
      const style = document.createElement('style');
      style.textContent = `
        :host {
          display: block;
          border: 1.5px dashed ${accentColor};
          border-radius: 10px;
          padding: 12px 14px;
          background: #f8fafc;
        }
        .title {
          font-size: 12px;
          font-weight: 700;
          color: #475569;
          margin-bottom: 6px;
          font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        }
        .desc {
          font-size: 12.5px;
          color: #64748b;
          margin-bottom: 10px;
        }
        img {
          display: block;
          width: 100%;
          height: auto;
          border-radius: 6px;
        }
      `;

      const title = document.createElement('div');
      title.className = 'title';
      title.textContent = modeLabel;

      const desc = document.createElement('div');
      desc.className = 'desc';
      desc.textContent = `Inner <img> load (~${durationMs}ms)`;

      const img = document.createElement('img');
      const start = performance.now();

      // Re-assigning img.src inside img's load handler keeps the Document's
      // load-event-delay count > 0 until durationMs elapses.
      img.addEventListener('load', () => {
        const elapsed = performance.now() - start;
        if (elapsed < durationMs) {
          const pct = Math.min(99, Math.round((elapsed / durationMs) * 100));
          img.src = makeProgressSvg(`Loading shadow <img> (${pct}%)`, pct, accentColor, false);
        } else if (!img.dataset.done) {
          img.dataset.done = '1';
          console.log(`[Shadow <img> finished] ${modeLabel} at ${Math.round(performance.now())}ms`);
          img.src = makeProgressSvg(`Loaded at ${Math.round(performance.now())}ms`, 100, accentColor, true);
        }
      });

      img.src = makeProgressSvg('Loading shadow <img> (0%)', 0, accentColor, false);
      sr.append(style, title, desc, img);
    }

    customElements.define('open-load-card', class extends HTMLElement {
      connectedCallback() {
        const sr = this.attachShadow({ mode: 'open' });
        buildSlowLoadWidget(sr, '<open-load-card#open-host> (open)', '#2563eb', 1200);
      }
    });

    customElements.define('closed-load-card', class extends HTMLElement {
      connectedCallback() {
        const sr = this.attachShadow({ mode: 'closed' });
        buildSlowLoadWidget(sr, '<closed-load-card#closed-host> (closed)', '#0f766e', 2400);
      }
    });

    window.addEventListener('DOMContentLoaded', (e) => {
      const t = `${Math.round(performance.now())}ms`;
      vState.textContent = JSON.stringify(document.readyState);
      vDcl.textContent = t;
      console.log('[DOMContentLoaded]', t, e);
    });

    window.addEventListener('load', (e) => {
      const t = `${Math.round(performance.now())}ms`;
      vState.textContent = JSON.stringify(document.readyState);
      vLoad.textContent = t;
      console.log('[window.onload]', t, e);
    });
  </script>
</body>
</html>
